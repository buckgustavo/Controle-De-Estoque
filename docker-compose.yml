version: '3.8'

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./my-app/backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_user -d estoque_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./my-app/backend
    ports:
      - "8000:8000"
    env_file:
      - ./my-app/backend/.env
    volumes:
      - ./my-app/backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./my-app
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./my-app:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
